servers:
  hosts:
    nbsp.example:
      site_hostname: "nbsp.example"
      sysadmin_email: "contact@nbsp.example"
      sysadmin_user_name: "example"
      sysadmin_user_ssh_key: "your ssh public key"
      nbsp_pg_database: "nbsp-example"
      nbsp_pg_host: "/var/run/postgresql"
      nbsp_pg_username: "nbsp"
      enable_caddy_tls: true
      nbsp_community_title: "non-breaking space"
      nbsp_community_subtitle: "a thoughtful community forum platform"
      setup_prometheus_node_exporter: false
      node_exporter_hostname: "node.nbsp.example"
      caddy_basic_auth_node_exporter: ""
      setup_prometheus_nbsp_metrics: false
      nbsp_metrics_hostname: "metrics.nbsp.example"
      caddy_basic_auth_nbsp_metrics: ""
